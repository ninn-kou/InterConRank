[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "InterConRank"
version = "0.1.0"
description = "Joint Node Centrality in Interconnected Heterogeneous Networks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[tool.setuptools]
packages = ["interconrank"]
